# Bigcapital (self-hosted) — adaptado para Coolify
# Base: docker-compose.prod.yml oficial de bigcapitalhq/bigcapital (AGPL-3.0)
#
# Autocontenido: la config de Envoy y el GRANT de MySQL van inline vía `configs`,
# así NO depende de archivos del repo (funciona igual clonando el repo o pegando el YAML).
#
# Publica el dominio en el servicio `proxy` (Envoy, puerto 80):
#   /api  -> server:3000   |   resto -> webapp:80

services:
  # Entry point. En Coolify, asigna el dominio a ESTE servicio, puerto 80.
  proxy:
    image: envoyproxy/envoy:v1.30-latest
    restart: unless-stopped
    expose:
      - "80"
    configs:
      - source: envoy_config
        target: /etc/envoy/envoy.yaml
    depends_on:
      - server
      - webapp
    networks:
      - bigcapital

  webapp:
    image: bigcapitalhq/webapp:latest
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - bigcapital

  server:
    image: bigcapitalhq/server:latest
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - mysql
      - redis
      - gotenberg
    environment:
      BASE_URL: ${BASE_URL}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_SECURE: ${MAIL_SECURE}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      DB_HOST: mysql
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_CHARSET: ${DB_CHARSET}
      SYSTEM_DB_NAME: ${SYSTEM_DB_NAME}
      TENANT_DB_NAME_PERFIX: ${TENANT_DB_NAME_PERFIX}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      QUEUE_HOST: redis
      QUEUE_PORT: "6379"
      CLICKHOUSE_ENABLED: "false"
      SIGNUP_DISABLED: ${SIGNUP_DISABLED}
      SIGNUP_ALLOWED_DOMAINS: ${SIGNUP_ALLOWED_DOMAINS}
      SIGNUP_ALLOWED_EMAILS: ${SIGNUP_ALLOWED_EMAILS}
      SIGNUP_EMAIL_CONFIRMATION: ${SIGNUP_EMAIL_CONFIRMATION}
      GOTENBERG_URL: http://gotenberg:3000
      GOTENBERG_DOCS_URL: http://server:3000/public/
      EXCHANGE_RATE_SERVICE: ${EXCHANGE_RATE_SERVICE}
      OPEN_EXCHANGE_RATE_APP_ID: ${OPEN_EXCHANGE_RATE_APP_ID}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
      STRIPE_PAYMENT_SECRET_KEY: ${STRIPE_PAYMENT_SECRET_KEY}
      STRIPE_PAYMENT_PUBLISHABLE_KEY: ${STRIPE_PAYMENT_PUBLISHABLE_KEY}
      STRIPE_PAYMENT_CLIENT_ID: ${STRIPE_PAYMENT_CLIENT_ID}
      STRIPE_PAYMENT_WEBHOOKS_SECRET: ${STRIPE_PAYMENT_WEBHOOKS_SECRET}
      STRIPE_PAYMENT_REDIRECT_URL: ${STRIPE_PAYMENT_REDIRECT_URL}
      THROTTLE_GLOBAL_TTL: ${THROTTLE_GLOBAL_TTL}
      THROTTLE_GLOBAL_LIMIT: ${THROTTLE_GLOBAL_LIMIT}
      THROTTLE_AUTH_TTL: ${THROTTLE_AUTH_TTL}
      THROTTLE_AUTH_LIMIT: ${THROTTLE_AUTH_LIMIT}
    networks:
      - bigcapital

  # Corre migraciones y termina (exit 0). El CLI vive en /app/packages/server.
  migration:
    image: bigcapitalhq/server:latest
    restart: "no"
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_CHARSET: ${DB_CHARSET}
      SYSTEM_DB_NAME: ${SYSTEM_DB_NAME}
      TENANT_DB_NAME_PERFIX: ${TENANT_DB_NAME_PERFIX}
    command: >
      sh -c "until nc -z mysql 3306; do echo 'esperando mysql...'; sleep 3; done;
      if [ -f /app/packages/server/dist/cli.js ]; then cd /app/packages/server; fi;
      node dist/cli.js system:migrate:latest && node dist/cli.js tenants:migrate:latest"
    networks:
      - bigcapital

  mysql:
    image: mariadb:10.2
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${SYSTEM_DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    configs:
      - source: mysql_grant
        target: /docker-entrypoint-initdb.d/10-grant.sql
    expose:
      - "3306"
    networks:
      - bigcapital

  redis:
    image: redis:6.2.21
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - bigcapital

  gotenberg:
    image: gotenberg/gotenberg:7
    restart: unless-stopped
    expose:
      - "9000"
    networks:
      - bigcapital

configs:
  envoy_config:
    content: |
      static_resources:
        listeners:
          - name: listener_0
            address:
              socket_address:
                address: 0.0.0.0
                port_value: 80
            filter_chains:
              - filters:
                  - name: envoy.filters.network.http_connection_manager
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                      stat_prefix: ingress_http
                      route_config:
                        name: local_route
                        virtual_hosts:
                          - name: backend
                            domains: ['*']
                            routes:
                              - match:
                                  prefix: '/api'
                                route:
                                  cluster: dynamic_server
                              - match:
                                  prefix: '/'
                                route:
                                  cluster: webapp
                      http_filters:
                        - name: envoy.filters.http.router
                          typed_config:
                            "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        clusters:
          - name: dynamic_server
            connect_timeout: 0.25s
            type: STRICT_DNS
            dns_lookup_family: V4_ONLY
            lb_policy: ROUND_ROBIN
            load_assignment:
              cluster_name: dynamic_server
              endpoints:
                - lb_endpoints:
                    - endpoint:
                        address:
                          socket_address:
                            address: server
                            port_value: 3000
          - name: webapp
            connect_timeout: 0.25s
            type: STRICT_DNS
            dns_lookup_family: V4_ONLY
            lb_policy: ROUND_ROBIN
            load_assignment:
              cluster_name: webapp
              endpoints:
                - lb_endpoints:
                    - endpoint:
                        address:
                          socket_address:
                            address: webapp
                            port_value: 80

  # El usuario lo crea la imagen oficial con MYSQL_USER/MYSQL_PASSWORD.
  # Aquí solo se le dan privilegios globales para crear las DBs por tenant.
  # NOTA: el nombre debe coincidir con DB_USER del .env.
  mysql_grant:
    content: |
      GRANT ALL PRIVILEGES ON *.* TO 'bigcapital'@'%' WITH GRANT OPTION;
      FLUSH PRIVILEGES;

volumes:
  mysql_data:
  redis_data:

networks:
  bigcapital:
    driver: bridge
